name: Desktop

# Compiles the Tauri (Rust) desktop shell on every platform and runs an
# end-to-end smoke test of the packaged app in a real webview. This is the
# safety net for the "browser-only desktop" architecture (the Python sidecar
# was retired): it proves the Rust shell builds and that the bundled SPA —
# including the Pyodide engine — boots inside WebKitGTK / WebView2.
#
# Coverage note: macOS is compile-only. WKWebView has no WebDriver support, so
# the runtime (Pyodide-in-webview) check on macOS is a manual smoke test.

on:
  push:
    branches: ["**"]
    paths:
      - "utde-app/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "utde-app/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    name: Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (build the toolpath_engine wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: utde-app/src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: utde-app
        run: npm ci

      - name: Build the SPA (embedded by tauri::generate_context!)
        working-directory: utde-app
        run: npm run build

      - name: Compile the Rust shell
        run: cargo build --manifest-path utde-app/src-tauri/Cargo.toml --locked

      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --manifest-path utde-app/src-tauri/Cargo.toml --all-targets

  e2e-linux:
    name: E2E (Linux webview)
    runs-on: ubuntu-latest
    # SCAFFOLD: the tauri-driver + WebdriverIO harness is validated on its first
    # real run — keep it non-blocking until it's confirmed green, then flip this.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux + WebDriver deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install frontend deps
        working-directory: utde-app
        run: npm ci

      - name: Self-host Pyodide (hermetic — no CDN during the test)
        working-directory: utde-app
        run: npm run fetch-pyodide

      - name: Build the desktop app (debug) with self-hosted Pyodide
        working-directory: utde-app
        env:
          VITE_PYODIDE_INDEX_URL: /pyodide/
        run: |
          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --locked

      - name: Install E2E harness
        working-directory: utde-app/e2e
        run: npm install   # no lockfile committed for the scaffold harness

      - name: Run WebdriverIO smoke test under Xvfb
        working-directory: utde-app/e2e
        run: xvfb-run -a npm test
